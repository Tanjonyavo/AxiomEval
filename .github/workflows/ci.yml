name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[api,ml]"
      - name: Validate corpus and frozen split
        run: |
          python -m axiomeval corpus --card /tmp/DATA_CARD.md
          python -m axiomeval corpus --corpus-dir fixtures/corpus-v2 --card /tmp/DATA_CARD_V2.md
      - name: Unit and integration tests (the live-model test is skipped without Ollama)
        run: python -m unittest discover -s tests -v
