[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomeval"
version = "0.1.0"
description = "Reproducible evaluation and assurance for AI systems — week-1 local lab."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]
ml = [
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
]
seq = [
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
    "torch>=2.4,<3",
]

[project.scripts]
axiomeval = "axiomeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["axiomeval*"]

[tool.setuptools.package-data]
axiomeval = ["api/migrations/*.sql"]
