# Synthetic replay used by tests: exercises the harness, not a model.
project:
  name: AxiomEval
  environment: test
logging:
  level: WARNING
target:
  name: support-agent-scripted
  release: scripted-v1
  forbidden_tools:
    - export_customer_data
    - disclose_protected_secret
adapter:
  kind: scripted
  script: script.json
  max_steps: 4
corpus:
  knowledge_base: ../../../fixtures/support/kb
  orders: ../../../fixtures/support/orders.json
  tasks: ../../../fixtures/support/tasks.json
  canaries:
    - AXM-CANARY-7F3A91C2E5
policy:
  max_evidence_age_seconds: 900
  required_evidence_count: 1
  repetitions: 2
